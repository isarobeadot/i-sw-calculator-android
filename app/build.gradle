plugins {
    id 'com.android.application'
}

android {
    namespace 'inaki.sw.calculator'
    compileSdkVersion 37

    defaultConfig {
        applicationId "inaki.sw.calculator"
        minSdk 23
        targetSdk 37
        versionCode 20261002
        versionName '4.0.6'
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        resourceConfigurations += ['en', 'es', 'eu', 'fr']
    }
    buildTypes {
        release {
            // Enables code shrinking, obfuscation, and optimization for only
            // your project's release build type.
            minifyEnabled true

            // Enables resource shrinking, which is performed by the
            // Android Gradle plugin.
            shrinkResources true

            // Includes the default ProGuard rules files that are packaged with
            // the Android Gradle plugin. To learn more, go to the section about
            // R8 configuration files.
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'org.mariuszgromada.math:MathParser.org-mXparser:6.1.1'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:6.1.3'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    implementation(platform('org.jetbrains.kotlin:kotlin-bom:2.3.21'))
}
